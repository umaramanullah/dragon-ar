<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dragon AR – camera</title>
<script src="aframe.min.js"></script>
<script src="aframe-ar.js"></script>
<script src="dragon.js"></script>
<script>
  AFRAME.registerComponent('dragon', {
    init() {
      this.d = buildDragon(AFRAME.THREE);
      this.d.object.scale.setScalar(.62);
      this.el.setObject3D('mesh', this.d.object);
      window.__dragon = this.d;
    },
    tick(t, dt) { this.d.update(t / 1000, dt / 1000); }
  });
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 10px; align-items: center; justify-content: space-between;
         padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.65)); color: #fff; pointer-events: none; }
  #status { display: flex; align-items: center; gap: 8px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #f5b324; box-shadow: 0 0 0 4px rgba(245,179,36,.25); }
  #status.found #dot { background: #2fd17f; box-shadow: 0 0 0 4px rgba(47,209,127,.3); }
  #fire { pointer-events: auto; border: 0; border-radius: 999px; padding: 12px 18px; min-height: 44px; font: 600 15px system-ui, sans-serif;
          background: #e9b949; color: #1b1300; }
  #fire:disabled { opacity: .45; }
  #err { display: none; position: fixed; inset: 0; z-index: 20; background: #0b2a1d; color: #f2e6c4; padding: 28px; }
  #err h1 { font-size: 24px; margin: 0 0 10px; }
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; cameraParametersUrl: camera_para.dat">
  <a-entity light="type: ambient; intensity: .65"></a-entity>
  <a-entity light="type: directional; intensity: .95" position="1 3 2"></a-entity>
  <a-marker id="marker" type="pattern" url="patt.hiro" smooth="true" smoothCount="6" smoothTolerance=".01" smoothThreshold="4" emitevents="true">
    <a-entity dragon></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<div id="hud">
  <div id="status"><span id="dot"></span><span id="msg">Point your camera at the marker</span></div>
  <button id="fire" disabled>Breathe fire</button>
</div>
<div id="err"><h1>Camera not available</h1><p id="errmsg">Allow camera access for this page, then reload. The page must be opened over https.</p></div>

<script>
{
  const st = document.getElementById('status'), msg = document.getElementById('msg'), fire = document.getElementById('fire');
  const m = document.getElementById('marker');
  m.addEventListener('markerFound', () => { st.classList.add('found'); msg.textContent = 'Dragon found'; fire.disabled = false; });
  m.addEventListener('markerLost', () => { st.classList.remove('found'); msg.textContent = 'Point your camera at the marker'; fire.disabled = true; });
  fire.addEventListener('click', () => window.__dragon && window.__dragon.breathe());
  window.addEventListener('camera-error', e => {
    document.getElementById('err').style.display = 'block';
    if (!window.isSecureContext) document.getElementById('errmsg').textContent = 'This page needs https to use the camera.';
  });
}
</script>
</body>
</html>
